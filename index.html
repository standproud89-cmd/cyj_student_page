<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Point Book</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#22232b; --sub:#6b7280;
    --brand:#5b6bf5; --brand-dark:#4351d8; --accent:#ff9f43;
    --danger:#e5484d; --ok:#2fb380; --line:#e7e8ee;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;}
  header .logo{font-weight:800;font-size:18px;letter-spacing:-0.5px;}
  header .logo span{color:var(--brand);}
  header .spacer{flex:1;}
  .pill{display:flex;align-items:center;gap:6px;background:#eef0ff;color:var(--brand-dark);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;}
  .pill.stock{background:#fff1e2;color:#b1580a;}
  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;transition:transform .05s;}
  .btn:active{transform:scale(0.97);}
  .btn.secondary{background:#eef0f4;color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--brand-dark);}
  .btn.danger{background:#fdeceb;color:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  main{max-width:1080px;margin:0 auto;padding:16px;padding-bottom:90px;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;}
  .tab{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:14px;}
  h2{font-size:16px;margin:0 0 12px;}
  h3{font-size:14px;margin:0 0 8px;color:var(--sub);font-weight:700;}
  .grid{display:grid;gap:12px;}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:720px){.grid.cols-3{grid-template-columns:repeat(2,1fr);}.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
  .item-card{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:#fafbff;position:relative;}
  .item-card.owned{border-color:#c9d0ff;}
  .item-card.equipped{border-color:var(--brand);background:#eef0ff;}
  .item-card svg{width:100%;height:80px;}
  .item-card .name{font-size:13px;font-weight:700;margin-top:4px;}
  .item-card .price{font-size:12px;color:var(--sub);margin-bottom:6px;}
  .item-card .badge{position:absolute;top:6px;right:6px;font-size:10px;background:var(--brand);color:#fff;padding:2px 6px;border-radius:6px;font-weight:700;}
  .product-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafbff;display:flex;flex-direction:column;gap:8px;}
  .product-card .icon{font-size:36px;text-align:center;}
  .product-card .name{font-weight:800;font-size:14px;}
  .product-card .meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;}
  .avatar-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .avatar-frame{width:220px;height:220px;border-radius:18px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;}
  .avatar-frame svg{width:100%;height:100%;display:block;}
  .cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .cat-btn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;}
  .cat-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--sub);font-weight:700;font-size:12px;}
  .row-actions{display:flex;gap:6px;}
  .empty{color:var(--sub);font-size:13px;padding:20px 0;text-align:center;}
  .student-pick{display:flex;flex-wrap:wrap;gap:10px;}
  .student-chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .student-chip:hover{border-color:var(--brand);}
  .role-screen{max-width:420px;margin:60px auto;text-align:center;}
  .role-screen h1{font-size:22px;margin-bottom:4px;}
  .role-screen p{color:var(--sub);font-size:14px;margin-bottom:24px;}
  .role-btns{display:flex;flex-direction:column;gap:10px;}

  /* ---- 로그인 페이지 ---- */
  .login-page{min-height:100vh;display:flex;flex-direction:column;background:#fff;}
  .login-topbar{padding:28px clamp(20px,4vw,52px);}
  .login-logo{height:clamp(64px,10vw,110px);display:block;}
  .login-center{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:#fff;border-radius:28px;padding:clamp(36px,6vw,64px) clamp(32px,7vw,72px);max-width:640px;width:100%;text-align:center;}
  .login-card .login-icon{font-size:56px;margin-bottom:10px;}
  .login-card h1{font-size:clamp(28px,4vw,38px);margin:0 0 10px;}
  .login-card .login-sub{color:var(--sub);font-size:clamp(15px,1.8vw,18px);margin:0 0 34px;}
  .login-card form{text-align:left;}
  .login-card .field{margin-bottom:18px;}
  .login-card .field label{font-size:14px;margin-bottom:6px;}
  .login-card .field input{padding:16px 18px;font-size:18px;border-radius:12px;}
  .login-card button.btn{width:100%;margin-top:10px;padding:17px;font-size:18px;border-radius:12px;}
  .login-help{font-size:13.5px;}
  .login-error{background:#fdeceb;border:1px solid #f6c9c6;color:var(--danger);padding:9px 13px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:none;text-align:left;}
  .login-help{margin-top:18px;font-size:11.5px;color:var(--sub);line-height:1.6;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,20,30,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:16px;padding:20px;max-width:380px;width:100%;}
  .modal h3{margin-top:0;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .field input,.field select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .status-tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;}
  .status-pending{background:#fff4d6;color:#96760a;}
  .status-collected{background:#dcf7e9;color:#177a4c;}
  .status-cancelled{background:#fdeceb;color:var(--danger);}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

  .mypage-grid{display:grid;grid-template-columns:200px 1fr 220px;gap:14px;align-items:start;}
  @media (max-width:900px){.mypage-grid{grid-template-columns:1fr;}}
  .mp-col{display:flex;flex-direction:column;gap:14px;}
  .mp-avatar-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;}
  .mp-avatar-placeholder{width:88px;height:88px;border-radius:50%;background:#eef0f4;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;}
  .mp-name{font-weight:800;font-size:15px;}
  .mp-level{font-size:12px;color:var(--sub);font-weight:700;margin-top:2px;}
  .mp-feature-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;}
  .mp-feature-item{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub);}
  .mp-feature-item.disabled{background:#fafbff;opacity:0.6;cursor:not-allowed;}
  .mp-feature-item:not(.disabled){background:#fafbff;cursor:pointer;}
  .mp-feature-item:not(.disabled):hover{background:#eef0ff;color:var(--brand-dark);}
  .star-icon{display:inline-block;background:var(--c,#f5c518);clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);flex-shrink:0;}
  .pending-tray-wrap{background:#fff7e0;border:1px dashed #f0c94a;border-radius:14px;padding:12px;margin:4px 0 14px;}
  .pending-tray-label{font-size:12px;font-weight:700;color:#8a6d1a;margin-bottom:8px;}
  .pending-tray{display:flex;gap:10px;flex-wrap:wrap;}
  .pending-chip{position:relative;width:50px;height:50px;border-radius:14px;background:#fff;border:1px solid #f0c94a;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:chipInvite 1.4s ease-in-out infinite;}
  .pending-chip:hover{transform:translateY(-2px);}
  .pending-chip.popping{animation:chipPop .8s ease-in forwards;pointer-events:none;}
  @keyframes chipInvite{0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,0.5);}50%{box-shadow:0 0 0 6px rgba(245,197,24,0);}}
  @keyframes chipPop{0%{transform:scale(1);opacity:1;}35%{transform:scale(1.3);opacity:1;}75%{transform:scale(1.05);opacity:1;}100%{transform:scale(0.2);opacity:0;}}
  .spark{position:absolute;top:50%;left:50%;font-size:15px;opacity:0;line-height:1;}
  .popping .spark{animation:sparkOut .8s ease-out forwards;}
  @keyframes sparkOut{0%{transform:translate(-50%,-50%) translate(0,0) scale(0.4) rotate(0deg);opacity:1;}55%{opacity:1;}100%{transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(1.15) rotate(180deg);opacity:0;}}
  .spark.b1{--tx:-30px;--ty:-26px;} .spark.b2{--tx:28px;--ty:-28px;} .spark.b3{--tx:-34px;--ty:10px;}
  .spark.b4{--tx:32px;--ty:14px;} .spark.b5{--tx:0px;--ty:-38px;} .spark.b6{--tx:0px;--ty:32px;}
  @keyframes slotPopIn{0%{transform:scale(0);}60%{transform:scale(1.3);}100%{transform:scale(1);}}
  .sticker-slot.slot-pop-in{animation:slotPopIn .5s cubic-bezier(.34,1.56,.64,1);}
  .cat-row-list{display:flex;flex-direction:column;gap:6px;}
  .cat-row-mini{display:flex;align-items:center;gap:8px;background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .cat-row-mini-label{flex:1;font-size:12px;font-weight:700;color:var(--ink);}
  .cat-row-mini-count{font-size:12px;font-weight:800;color:var(--brand-dark);}
  .sticker-board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:#fff3c4;border-radius:14px;padding:14px;margin:12px 0 8px;}
  .sticker-slot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,0.55);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .sticker-slot.filled{background:#fff;box-shadow:0 2px 5px rgba(150,110,10,0.28);}
  .sticker-slot.filled svg.sticker-badge{width:92%;height:92%;}
  .pending-chip svg.sticker-badge{width:86%;height:86%;}
  .board-nav{display:flex;align-items:center;justify-content:center;gap:14px;}
  .market-list-header{display:grid;grid-template-columns:56px 1fr 100px 88px;gap:10px;padding:0 10px 8px;font-size:12px;font-weight:700;color:var(--sub);}
  .market-product-list{display:flex;flex-direction:column;gap:8px;}
  .market-product-row{display:grid;grid-template-columns:56px 1fr 100px 88px;align-items:center;gap:10px;background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:10px;}
  .mp-product-icon{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;}
  .mp-product-name{font-weight:800;font-size:14px;}
  .mp-product-stock{font-size:11px;color:var(--sub);margin-top:2px;}
  .mp-product-price{font-size:14px;font-weight:800;color:var(--brand-dark);white-space:nowrap;}
  .market-product-row .btn{padding:8px 0;font-size:12px;}
  .mp-stat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .mp-stat-box h3{margin:0 0 6px;font-size:12px;color:var(--sub);font-weight:700;}
  .mp-stat-num{font-size:20px;font-weight:800;}
  .mp-chart-placeholder{height:90px;border-radius:10px;background:#f4f5f9;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;font-weight:700;}
  .mp-stat-box.empty-box{min-height:44px;background:#fafbff;}

  /* 선생님 대문 (Students Point Book) */
  .teacher-home{text-align:center;padding:40px 0;}
  .teacher-home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:560px;margin:0 auto;}
  @media (max-width:560px){.teacher-home-grid{grid-template-columns:1fr;}}
  .teacher-home-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 16px;cursor:pointer;transition:transform .08s,box-shadow .08s;}
  .teacher-home-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,30,60,0.08);border-color:#c9d0ff;}
  .teacher-home-card:active{transform:scale(0.98);}
  .thc-icon{font-size:38px;margin-bottom:10px;}
  .thc-title{font-size:18px;font-weight:800;margin-bottom:4px;}
  .thc-desc{font-size:12px;color:var(--sub);}

  /* SPB (반+학생 통합) */
  .spb-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .spb-controls select, .spb-controls input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;}
  .spb-table{border-collapse:collapse;width:100%;min-width:920px;}
  .spb-table th{font-size:11px;color:var(--sub);font-weight:700;padding:6px 8px;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap;}
  .spb-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px;}
  .spb-table .row-actions{display:flex;align-items:center;gap:4px;}
  .spb-num{width:48px;padding:6px;border-radius:6px;border:1px solid var(--line);}
</style>
</head>

function levelDef(key){ return LEVEL_DEFS.find(l=>l.key===key) || LEVEL_DEFS[0]; }
function timeSlotLabel(dayGroup, slotKey){
  const list = TIME_SLOTS_BY_DAYGROUP[dayGroup] || [];
  const found = list.find(s=>s.key===slotKey);
  return found ? found.label : slotKey;
}
function buildClassCode(dayGroup, timeSlot, levelKey, levelNum, group){
  return `${dayGroup}(${timeSlot})${levelDef(levelKey).initial}${levelNum}-${group}`;

}

function loadDB(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(!parsed.classes) parsed.classes = []; // 구버전 데이터 호환
      (parsed.students||[]).forEach(s=>{ // 구버전 데이터 호환: 로그인 계정 정보가 없으면 채워넣기
        if(!s.loginId){
          s.loginId = (s.englishName||s.name||"").toLowerCase().replace(/[^a-z0-9]/g,"") || s.id;
          s.password = s.loginId;
        }
      });
      return parsed;
    }catch(e){ /* fall through to reseed */ }
  }
  const seeded = seedData();
  saveDB(seeded);
  return seeded;
}
function saveDB(db){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

let DB = loadDB();
function persist(){ saveDB(DB); }

// 스티커를 판에 붙일 때 나는 효과음 — "차르르 아르페지오" (외부 파일 없이 즉석 합성)
function playStickerPlaceSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i)=>{
      const start = now + i*0.07;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.22, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.24);
    });
  }catch(e){ /* 오디오를 지원하지 않는 환경이면 조용히 무시 */ }
}

  if(!categoryId) return GENERIC_STICKER_COLOR;
  const t = STICKER_TYPES.find(t=>t.id===categoryId);

function lightenColor(hex, amt){
  amt = amt===undefined ? 0.4 : amt;
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const nr = Math.round(r + (255-r)*amt), ng = Math.round(g + (255-g)*amt), nb = Math.round(b + (255-b)*amt);
  return `rgb(${nr},${ng},${nb})`;
}

}

function buyAvatarItem(studentId, itemId){
  const st = getStudent(studentId), item = getItem(itemId);
  if(!st || !item) return;
  if(st.inventory.includes(itemId)){ showToast("이미 가지고 있어요"); return; }
  if(st.stickers < item.price){ showToast("스티커가 부족해요"); return; }
  st.stickers -= item.price;
  st.inventory.push(itemId);
  st.avatar[item.category] = itemId;
  addLedger(studentId, -item.price, `아이템 구매: ${item.name}`);
  persist();
  showToast(`${item.name} 구매 완료!`);
  render();
}

function equipItem(studentId, itemId){
  const st = getStudent(studentId), item = getItem(itemId);
  if(!st || !item) return;
  if(!st.inventory.includes(itemId)) return;
  st.avatar[item.category] = itemId;
  persist();
  render();
}

function buyProduct(studentId, productId){
  const st = getStudent(studentId), pd = getProduct(productId);
  if(!st || !pd) return;
  if(pd.stock <= 0){ showToast("품절된 상품이에요"); return; }
  if(st.stickers < pd.price){ showToast("스티커가 부족해요"); return; }
  st.stickers -= pd.price;
  pd.stock -= 1;
  DB.orders.unshift({id:uid("od"), studentId, productId, price:pd.price, status:"pending", ts:now()});
  addLedger(studentId, -pd.price, `물품 구매 예약: ${pd.name}`);
  persist();
  showToast(`${pd.name} 예약 완료! 마켓데이에 선생님께 받아가세요`);
  render();
}

function markOrderCollected(orderId){
  const od = DB.orders.find(o=>o.id===orderId);
  if(!od || od.status !== 'pending') return;
  od.status = 'collected';
  persist();
  render();
}

function cancelOrder(orderId){
  const od = DB.orders.find(o=>o.id===orderId);
  if(!od || od.status !== 'pending') return;
  const st = getStudent(od.studentId), pd = getProduct(od.productId);
  if(st) st.stickers += od.price;
  if(pd) pd.stock += 1;
  od.status = 'cancelled';
  if(st) addLedger(st.id, od.price, `주문 취소 환불: ${pd?pd.name:''}`);
  persist();
  render();
}

function getPendingStickers(student){ return (student.stickerLog||[]).filter(s=>!s.placed); }
function getPlacedStickers(student){ return (student.stickerLog||[]).filter(s=>s.placed); }
function getCategoryReceivedCount(student, catId){ return (student.stickerLog||[]).filter(s=>s.categoryId===catId).length; }

function placeSticker(studentId, stickerId){
  const st = getStudent(studentId);
  if(!st) return;
  const entry = (st.stickerLog||[]).find(s=>s.id===stickerId && !s.placed);
  if(!entry) return;
  entry.placed = true;
  entry.ts = now();
  st.totalEarned = (st.totalEarned||0) + 1;
  st.semesterEarned = (st.semesterEarned||0) + 1;
  st.stickers += 1;
  const cat = STICKER_TYPES.find(c=>c.id===entry.categoryId);
  addLedger(studentId, 1, `스티커북에 붙임: ${cat?cat.label:'스티커'}`);
  persist();
}

  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar-frame">${buildAvatarSVG(st.avatar)}</div>
      <div style="flex:1;min-width:200px;">
        <h2>내 아바타</h2>
        <p style="color:var(--sub);font-size:13px;">스티커로 아이템을 사서 자유롭게 꾸며보세요. 산 아이템은 마이페이지에서 다시 갈아입을 수 있어요.</p>
        <div class="pill">🍬 보유 스티커 ${st.stickers}개</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="cat-row" id="closetCats">
      ${CATEGORIES.map(c=>`<div class="cat-btn ${cat===c?'active':''}" data-cat="${c}">${CATEGORY_LABEL[c]}</div>`).join('')}
    </div>
    <div class="grid cols-4" id="closetItems">
      ${list.map(item=>{
        const owned = st.inventory.includes(item.id);
        const equipped = st.avatar[item.category] === item.id;
        return `
        <div class="item-card ${owned?'owned':''} ${equipped?'equipped':''}">
          ${equipped?'<div class="badge">착용중</div>':''}
          ${itemPreviewSVG(item)}
          <div class="name">${item.name}</div>
          <div class="price">${item.price===0 ? '기본 제공' : '🍬 '+item.price}</div>
          ${equipped ? `<button class="btn secondary" disabled>착용중</button>`
            : owned ? `<button class="btn secondary" data-equip="${item.id}">착용하기</button>`
            : `<button class="btn" data-buy="${item.id}" ${st.stickers<item.price?'disabled':''}>구매</button>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function bindCloset(){
  document.querySelectorAll('#closetCats .cat-btn').forEach(el=>{
    el.onclick = ()=>{ VIEW.closetCategory = el.dataset.cat; render(); };
  });
  document.querySelectorAll('[data-buy]').forEach(el=>{
    el.onclick = ()=> buyAvatarItem(VIEW.studentId, el.dataset.buy);
  });
  document.querySelectorAll('[data-equip]').forEach(el=>{
    el.onclick = ()=> equipItem(VIEW.studentId, el.dataset.equip);
  });
}

function renderMarketCenter(st){
  return `
    <div class="flex-between">
      <h2>🛒 마켓데이</h2>
      <div class="pill">🍬 ${st.stickers}</div>
    </div>
    <div class="market-list-header">
      <span>물품</span><span>물품명</span><span>포인트 차감량</span><span></span>
    </div>
    <div class="market-product-list">
      ${DB.products.map(p=>`
        <div class="market-product-row">
          <div class="mp-product-icon">${p.icon}</div>
          <div>
            <div class="mp-product-name">${p.name}</div>
            <div class="mp-product-stock">${p.stock>0 ? '재고 '+p.stock+'개' : '품절'}</div>
          </div>
          <div class="mp-product-price">🍬 -${p.price}</div>
          <button class="btn" data-buyproduct="${p.id}" ${p.stock<=0 || st.stickers<p.price ? 'disabled':''}>
            ${p.stock<=0 ? '품절' : '구매'}
          </button>
        </div>`).join('') || '<div class="empty">등록된 물품이 없어요</div>'}
    </div>
  `;
}
function bindMarketCenter(){
  document.querySelectorAll('[data-buyproduct]').forEach(el=>{
    el.onclick = ()=> buyProduct(VIEW.studentId, el.dataset.buyproduct);
  });
}

function renderMyPage(st){
  const myOrders = DB.orders.filter(o=>o.studentId===st.id);
  const statusLabel = {pending:"수령 대기", collected:"수령 완료", cancelled:"취소됨"};

  const totalEarned = st.totalEarned || 0;
  const semesterEarned = st.semesterEarned || 0;
  const level = Math.max(1, Math.floor(totalEarned / 20) + 1);
  const pending = getPendingStickers(st);
  const placed = getPlacedStickers(st);

  const totalPages = Math.max(1, Math.ceil(totalEarned / STICKERS_PER_BOARD_PAGE));
  if(VIEW.boardPage === null || VIEW.boardPage === undefined) VIEW.boardPage = totalPages - 1;
  VIEW.boardPage = Math.min(Math.max(0, VIEW.boardPage), totalPages - 1);
  const pageStart = VIEW.boardPage * STICKERS_PER_BOARD_PAGE;

  let boardCells = '';
  for(let i=0; i<STICKERS_PER_BOARD_PAGE; i++){
    const idx = pageStart + i;
    const entry = placed[idx];
    const isLast = VIEW.justPlacedFlag && idx === placed.length - 1;
    if(entry){
      boardCells += `<div class="sticker-slot filled ${isLast?'slot-pop-in':''}">${stickerBadge(entry.categoryId, 26)}</div>`;
    } else {
      boardCells += `<div class="sticker-slot"></div>`;
    }
  }

  const pendingHtml = pending.length ? pending.map(p=>{
    const color = stickerColor(p.categoryId);
    const cat = STICKER_TYPES.find(c=>c.id===p.categoryId);
    const popping = VIEW.poppingStickerId === p.id;
    return `<div class="pending-chip ${popping?'popping':''}" data-pending="${p.id}" title="${cat?cat.label:'스티커'} — 눌러서 붙이기">
      ${stickerBadge(p.categoryId, 36)}
      <span class="spark b1">✨</span><span class="spark b2">✨</span>
      <span class="spark b3">✨</span><span class="spark b4">✨</span>
      <span class="spark b5">✨</span><span class="spark b6">✨</span>
    </div>`;
  }).join('') : '';

  const catRows = STICKER_TYPES.map(cat=>{
    const count = getCategoryReceivedCount(st, cat.id);
    return `<div class="cat-row-mini">
      ${stickerBadge(cat.id, 28)}
      <div class="cat-row-mini-label">${cat.label}</div>
      <div class="cat-row-mini-count">${count}개</div>
    </div>`;
  }).join('');

  return `
  <div class="mypage-grid">
    <div class="mp-col mp-left">
      <div class="mp-avatar-box">
        <div class="mp-avatar-placeholder">🙂</div>
        <div class="mp-name">${st.name}</div>
        <div class="mp-level">레벨 ${level}</div>
      </div>
      <div class="mp-feature-list">
        <div class="mp-feature-item" id="openOrdersModalBtn">📦 <span>내 주문 확인</span></div>
        <div class="mp-feature-item disabled">🛒 <span>마켓데이</span></div>
        <div class="mp-feature-item disabled">🧩 <span>기능 준비중</span></div>
        <div class="mp-feature-item disabled">🧩 <span>기능 준비중</span></div>
      </div>
    </div>

    <div class="mp-col mp-center">
      <div class="card">
        ${VIEW.studentTab === 'market' ? renderMarketCenter(st) : `
        <div class="flex-between">
          <h2>My Point Book</h2>
          <div class="pill">🍬 ${st.stickers}</div>
        </div>

        ${pending.length ? `
        <div class="pending-tray-wrap">
          <div class="pending-tray-label">✨ 새로 받은 스티커를 직접 스티커북에 붙여보세요</div>
          <div class="pending-tray">${pendingHtml}</div>
        </div>` : ''}

        <div class="sticker-board">
          ${boardCells}
        </div>
        <div class="board-nav">
          <button class="btn secondary" id="boardPrev" ${VIEW.boardPage<=0?'disabled':''}>◀</button>
          <span style="font-size:13px;color:var(--sub);font-weight:700;">${VIEW.boardPage+1} / ${totalPages} 페이지</span>
          <button class="btn secondary" id="boardNext" ${VIEW.boardPage>=totalPages-1?'disabled':''}>▶</button>
        </div>
        `}
      </div>
    </div>

    <div class="mp-col mp-right">
      <div class="mp-stat-box"><h3>현재 보유 스티커</h3><div class="mp-stat-num">🍬 ${st.stickers}</div></div>
      <div class="mp-stat-box">
        <h3>숙제별 누적 스티커량</h3>
        <div class="cat-row-list">${catRows}</div>
      </div>
      <div class="mp-stat-box"><h3>이번 학기 스티커량</h3><div class="mp-stat-num">🍬 ${semesterEarned}</div></div>
      <div class="mp-stat-box"><h3>총 누적 스티커량</h3><div class="mp-stat-num">🍬 ${totalEarned}</div></div>
      <div class="mp-stat-box"><h3>사용된 스티커량</h3><div class="mp-stat-num">🍬 ${Math.max(0, totalEarned - st.stickers)}</div></div>
    </div>
  </div>

  ${VIEW.showOrdersModal ? `
  <div class="modal-bg" id="ordersModalBackdrop">
    <div class="modal" style="max-width:560px;">
      <div class="flex-between">
        <h3>내 주문 확인</h3>
        <button class="btn ghost" id="closeOrdersModal">닫기</button>
      </div>
      ${myOrders.length ? `<table><thead><tr><th>물품</th><th>가격</th><th>상태</th><th>일시</th></tr></thead><tbody>
        ${myOrders.map(o=>{
          const pd = getProduct(o.productId);
          return `<tr><td>${pd?pd.name:'(삭제된 상품)'}</td><td>🍬${o.price}</td>
            <td><span class="status-tag status-${o.status}">${statusLabel[o.status]}</span></td>
            <td>${new Date(o.ts).toLocaleString('ko-KR')}</td></tr>`;
        }).join('')}
      </tbody></table>` : '<div class="empty">아직 주문한 물품이 없어요</div>'}
    </div>
  </div>` : ''}
  `;
}
function bindMyPage(){
  const prevBtn = document.getElementById('boardPrev');
  const nextBtn = document.getElementById('boardNext');
  if(prevBtn) prevBtn.onclick = ()=>{ VIEW.boardPage = Math.max(0, VIEW.boardPage - 1); render(); };
  if(nextBtn) nextBtn.onclick = ()=>{ VIEW.boardPage = VIEW.boardPage + 1; render(); };

  document.querySelectorAll('[data-pending]').forEach(el=>{
    el.onclick = ()=>{
      if(el.classList.contains('popping')) return;
      const stickerId = el.dataset.pending;
      VIEW.poppingStickerId = stickerId;
      playStickerPlaceSound();
      render();
      setTimeout(()=>{
        placeSticker(VIEW.studentId, stickerId);
        VIEW.poppingStickerId = null;
        VIEW.justPlacedFlag = true;
        showToast('✨ 스티커북에 붙였어요! (+1)');
        render();
        setTimeout(()=>{ VIEW.justPlacedFlag = false; render(); }, 700);
      }, 800);
    };
  });

  const openOrders = document.getElementById('openOrdersModalBtn');
  if(openOrders) openOrders.onclick = ()=>{ VIEW.showOrdersModal = true; render(); };
  const closeOrders = document.getElementById('closeOrdersModal');
  if(closeOrders) closeOrders.onclick = ()=>{ VIEW.showOrdersModal = false; render(); };
  const backdrop = document.getElementById('ordersModalBackdrop');
  if(backdrop) backdrop.onclick = (e)=>{ if(e.target===backdrop){ VIEW.showOrdersModal=false; render(); } };

  bindMarketCenter();
}

render();
</script>
</body>
</html>
